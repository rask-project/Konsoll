{%- comment -%} A screenshot from docs/images: name, w, h, alt, optional caption. {%- endcomment -%}
<figure class="shot-frame">
  <img class="shot" src="{{ '/assets/screenshots/' | append: include.name | relative_url }}" width="{{ include.w }}" height="{{ include.h }}" alt="{{ include.alt }}" loading="lazy" decoding="async">
  {%- if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>
