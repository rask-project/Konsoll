title: Konsoll
tagline: A native terminal for macOS
description: >-
  Konsoll is a fast, native macOS terminal with glass tabs, split panes,
  Background Commands and AI coding agents that report to your tabs.
url: https://rask-project.github.io
baseurl: /Konsoll
repository: rask-project/Konsoll
github_url: https://github.com/rask-project/Konsoll
releases_url: https://github.com/rask-project/Konsoll/releases/latest
lang: en

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

# Google Search Console (jekyll-seo-tag writes the meta tag).
webmaster_verifications:
  google: qeoOLTSMTaGabKf32fyRufuplEvzC9VOFarZJhqGveM

feed:
  path: news/feed.xml

permalink: /news/:year/:month/:day/:title/

# Link previews (Open Graph / Twitter) and the logo in the structured data.
logo: /assets/konsoll.png
twitter:
  card: summary_large_image

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, image: /assets/screenshots/overview.png }
  - scope: { path: "" }
    values: { layout: page, image: /assets/screenshots/overview.png }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
