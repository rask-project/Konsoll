name: Release

# Push a tag (git tag v3.5.0 && git push origin v3.5.0) to build the
# self-contained app and publish it as a GitHub Release. The bundle is
# ad-hoc signed (no Apple Developer ID), so it is not notarized: users clear
# the quarantine flag once after downloading (see README "Install").
#
# A tag with a suffix (v3.6.0-beta.1, v3.6.0-rc.1) publishes a pre-release
# instead: it can point at a feature branch's commit, and the latest release
# stays the one users get (it is never marked Latest).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release, upload assets, push the appcast

# One release at a time: each one commits to the appcast branch.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish (macOS arm64)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe --tags for the display version

      - name: Install Qt 6.12
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          host: mac
          target: desktop
          arch: clang_64
          aqtversion: "==3.3.*"
          cache: true

      - name: Install tools
        run: brew install ninja

      - name: Configure
        run: |
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build/release

      - name: Use zsh as the login shell
        # Sessions start the passwd shell. The runner account uses bash; the
        # session self-tests are written against zsh, the macOS default.
        run: |
          dscl . -read "/Users/$USER" UserShell
          sudo dscl . -create "/Users/$USER" UserShell /bin/zsh
          dscacheutil -flushcache
          dscl . -read "/Users/$USER" UserShell

      - name: Self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: build/release/konsoll.app/Contents/MacOS/konsoll --selftest

      - name: Package (ad-hoc signed)
        run: |
          cmake --build build/release --target package-macos
          APP=build/release/dist/konsoll.app
          # The install step prunes unused Qt parts and ad-hoc signs the
          # bundle (cmake/PruneBundle.cmake).
          codesign --verify --deep --strict --verbose=2 "$APP"

          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "$APP" "out/Konsoll-$VERSION-arm64.zip"

          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Konsoll -srcfolder "$STAGE" -ov -format UDZO \
            "out/Konsoll-$VERSION-arm64.dmg"

          (cd out && shasum -a 256 Konsoll-* > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # docs/releases/<tag>.md, when present, opens the notes.
          NOTES="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$NOTES" ]; then cp "$NOTES" "$RUNNER_TEMP/notes.md"; else : > "$RUNNER_TEMP/notes.md"; fi
          cat >> "$RUNNER_TEMP/notes.md" <<'EOF'
          ## Install

          Konsoll is not notarized by Apple. After moving `konsoll.app` to
          `/Applications`, clear the quarantine flag once:

          ```sh
          xattr -dr com.apple.quarantine /Applications/konsoll.app
          ```

          Or open it, then allow it in **System Settings → Privacy & Security →
          Open Anyway**. Requires macOS 14.4+ on Apple Silicon.
          EOF
          # A stable release lists the changes since the previous stable one,
          # not since a pre-release in between.
          PREVIOUS=$(git tag --list 'v*' --sort=-v:refname | grep -v -- - | grep -vxF "$GITHUB_REF_NAME" | head -n 1 || true)
          FLAGS=(--latest)
          if [ -n "$PREVIOUS" ]; then FLAGS+=(--notes-start-tag "$PREVIOUS"); fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            FLAGS=(--prerelease --latest=false)
            {
              echo
              echo "> **Pre-release** built from \`${GITHUB_SHA::7}\` for testing; the latest"
              echo "> release remains the stable version."
            } >> "$RUNNER_TEMP/notes.md"
          fi
          gh release create "$GITHUB_REF_NAME" out/* "${FLAGS[@]}" \
            --title "Konsoll ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

      - name: Publish the update (Sparkle appcast)
        # "Check for Updates…" reads appcast.xml on the appcast branch. The
        # zip is signed with the EdDSA key whose public half is in the app
        # (KONSOLL_UPDATE_PUBLIC_KEY); a pre-release goes in the beta channel.
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set: the appcast was not updated."
            exit 0
          fi
          VERSION=${GITHUB_REF_NAME#v}
          ZIP="out/Konsoll-$VERSION-arm64.zip"
          PLIST=build/release/dist/konsoll.app/Contents/Info.plist
          if ! plutil -extract SUPublicEDKey raw "$PLIST" >/dev/null 2>&1; then
            echo "::error::The app has no SUPublicEDKey (KONSOLL_UPDATE_PUBLIC_KEY): it could not install this update."
            exit 1
          fi
          BUILD=$(plutil -extract CFBundleVersion raw "$PLIST")
          SPARKLE_BIN=$(echo build/release/_deps/sparkle-*/bin)
          SIGNATURE=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SPARKLE_BIN/sign_update" --ed-key-file - -p "$ZIP")
          CHANNEL=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then CHANNEL=(--channel beta); fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FEED="$RUNNER_TEMP/appcast"
          if git fetch origin appcast; then
            git worktree add -B appcast "$FEED" FETCH_HEAD
          else
            git worktree add --orphan -b appcast "$FEED"
          fi
          python3 -I tools/update-appcast.py "$FEED/appcast.xml" \
            --version "$VERSION" --build "$BUILD" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Konsoll-$VERSION-arm64.zip" \
            --length "$(stat -f %z "$ZIP")" --signature "$SIGNATURE" \
            --notes "docs/releases/$GITHUB_REF_NAME.md" \
            --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            "${CHANNEL[@]}"
          git -C "$FEED" add appcast.xml
          git -C "$FEED" commit -m "Konsoll $VERSION"
          git -C "$FEED" push origin appcast
