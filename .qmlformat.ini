; qmlformat settings (QML Coding Conventions, qmlformat's defaults), read by
; tools/format-code.sh and by Qt Creator when it formats QML with qmlformat.
; No line wrapping: qmlformat's wrapping splits expressions badly.
[General]
FunctionsSpacing=false
GroupAttributesTogether=false
IndentWidth=4
MaxColumnWidth=-1
NewlineType=unix
NormalizeOrder=false
ObjectsSpacing=false
SemicolonRule=always
SingleLineEmptyObjects=false
SortImports=false
UseTabs=false
